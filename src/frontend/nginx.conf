server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend corre en otro contenedor del mismo compose. Pasar por aqui
    # evita que el navegador tenga que pelear con CORS, y de paso deja la
    # pagina con una sola direccion: http://localhost:4200
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # el agente puede tardar: es un 9B compartido
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
